<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>a · 첫 장면(빈 틀)</title>
<link rel="stylesheet" href="../../../../tools/realkit/base.css">
<link rel="stylesheet" href="../../../../tools/realkit/motion.css">
<link rel="stylesheet" href="../../../../tools/realkit/vertical.css">
<!-- 정지 시안·브라우저 미리보기용 기본값. 렌더 때는 빌더가 대사 단어 시각으로 dur·cues를 넣는다. -->
<script>window.RK_DEFAULT = {dur: 8, cues: {s2: 4}};</script>
<script src="../../../../tools/realkit/vendor/three.min.js"></script>
<script src="../../../../tools/realkit/realkit.js"></script>
<script src="../../../../tools/realkit/captions.js"></script>
</head>
<body>
<div id="stage"></div>
<!-- 큰 숫자·낱말 카드(위쪽 1/3): 체감 비교를 크게, 원래 수치를 작게. 숫자 세기는 data-count(연도는 data-year로 쉼표 없이) -->
<div class="kw long" data-anim="pop@0.3, out@s2-0.15">체감 비교<small>원래 수치</small></div>
<!-- 3D 꼬리표: S.tag가 세로 안전 영역 안에 붙잡고 말 자막 띠(1100~1260px)를 피한다 -->
<div class="tag3d" id="tg" data-anim="pop@s2">이름표</div>
<script src="../../../../tools/realkit/scene3d.js"></script>
<script>
S3D.start((T, S) => {
  const c = RK.cues;
  S.ground({ cityMin: 950 });                                    // 바닥 + 낮은 모형 도시(cityMin 안쪽은 비워 카메라가 건물을 뚫지 않게)
  const body = S.box({ w: 120, h: 400, d: 120, color: '#e6dccb' });   // 설명할 물체 — 실제 모형으로 바꾼다(1단위 = 1m 등 비율을 정해 두면 숫자 맞추기 쉽다)
  S.box({ w: 150, h: 12, d: 150, color: '#c9bfae' });              // 받침
  S.tag(document.getElementById('tg'), [0, 430, 0]);              // 꼭대기 바로 위
  return t => {
    // 2~4초마다 그림이 바뀌게: 신호(c.s2)마다 카메라를 바꾼다
    if (t < c.s2) S.orbit(t, { from: 20, to: 5, dur: c.s2, radius: 760, radius2: 860, height: 60, height2: 140, look: [0, 250, 0], look2: [0, 280, 0] });   // 아래서 올려다보기(물체 전체가 화면에 들어오게)
    else S.orbit(t, { at: c.s2, from: -35, to: -15, dur: RK.dur - c.s2, radius: 1300, radius2: 1150, height: 700, height2: 600, look: [0, 200, 0] });      // 멀리서 주변과 함께
  };
}, { sky: ['#9fc2e2', '#f1e3c8'] });
</script>
</body></html>
