<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>b · 518m에서 멈출 뻔</title>
<link rel="stylesheet" href="../../../../tools/realkit/base.css">
<link rel="stylesheet" href="../../../../tools/realkit/motion.css">
<link rel="stylesheet" href="../../../../tools/realkit/vertical.css">
<script>window.RK_DEFAULT = {dur: 6.6, cues: {m518: 1.6, s4: 4.5, wind: 5.3}};</script>
<script src="../../../../tools/realkit/vendor/three.min.js"></script>
<script src="../../../../tools/realkit/realkit.js"></script>
<script src="../../../../tools/realkit/captions.js"></script>
</head>
<body>
<div id="stage"></div>
<div class="tag3d red" id="tg" data-anim="pop@m518">아파트 180층 · 518m</div>
<script src="../../../../tools/realkit/scene3d.js"></script>
<script src="burj.js"></script>
<script>
S3D.start((T, S) => {
  const c = RK.cues;
  S.ground({ cityH: 120 });
  BURJ.build(S, { ghostAbove: 518 });   // 518m 위는 '지어지지 않을 뻔한' 유령 부분
  const ring = new T.Mesh(new T.TorusGeometry(120, 3.2, 8, 64), new T.MeshBasicMaterial({ color: '#ff3b30' }));
  ring.rotation.x = Math.PI / 2; ring.position.y = 518; S.scene.add(ring);
  S.tag(document.getElementById('tg'), [150, 518, 0]);
  const wind = S.streaks(1300, '#1e7cf2', .1, .75);
  return t => {
    S.orbit(t, { from: 70, to: 40, dur: RK.dur, radius: 1250, radius2: 1100, height: 420, height2: 520, look: [0, 470, 0], look2: [0, 520, 0] });
    const k = S.ease.out(S.prog(t, c.m518 - .2, .6)); ring.scale.setScalar(.6 + .4 * k); ring.material.opacity = k; ring.visible = k > .01;
    const w = S.prog(t, c.s4, .8);   // '바람'부터 입자가 화면을 가로지른다
    wind.material.opacity = .75 * w; wind.visible = w > 0;
    wind.place(([u, v, z], tt) => [-1500 + ((u * 3000 + tt * 900) % 3000), 30 + v * 900, (z - .5) * 900], t);
  };
}, { sky: ['#9fc2e2', '#f1e3c8'] });
</script>
</body></html>
